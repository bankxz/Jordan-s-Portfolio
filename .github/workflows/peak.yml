name: Peak

on:
  push:
    paths:
      - "peak/**"
      - ".github/workflows/peak.yml"
  pull_request:
    paths:
      - "peak/**"
      - ".github/workflows/peak.yml"
  workflow_dispatch:

concurrency:
  group: peak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit-linux:
    name: PeakKit (Linux, Swift 6.1)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    defaults:
      run:
        working-directory: peak/Packages/PeakKit
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Test with ThreadSanitizer
        run: swift test --sanitize=thread

  server:
    name: Server (Swift 6.2 + Postgres 16)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: peak
          POSTGRES_DB: peak
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:peak@postgres:5432/peak?sslmode=disable
      REQUIRE_POSTGRES: "1"
    defaults:
      run:
        working-directory: peak/Server
    steps:
      - uses: actions/checkout@v4
      - name: Test (in-memory + Postgres contract, routes, workers, app compatibility)
        run: swift test
      - name: Test with ThreadSanitizer
        run: swift test --sanitize=thread

  server-image:
    name: Server Docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f peak/Server/Dockerfile -t peak-server peak
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e ROBLOX_CLIENT_ID=ci -e ROBLOX_CLIENT_SECRET=ci-secret \
            -e ROBLOX_REDIRECT_URI=https://example.com/oauth/roblox/callback \
            -e TOKEN_ENCRYPTION_KEY="$(head -c 32 /dev/urandom | base64)" \
            peak-server
          for i in $(seq 1 30); do curl -fs localhost:8080/health && break; sleep 1; done
          test "$(curl -fs localhost:8080/health)" = "ok"
          curl -fs -X POST localhost:8080/v1/auth/roblox/start | grep -q "apis.roblox.com"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/dashboard)" = "401"
          if docker logs smoke 2>&1 | grep -q "ci-secret"; then echo "client secret leaked into logs"; exit 1; fi
          docker stop smoke

  ios:
    name: iOS app (build, unit + UI tests, screenshots)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write   # only to publish screenshots to the ci-screenshots/<branch> branch
    defaults:
      run:
        working-directory: peak
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: PeakKit tests (macOS)
        working-directory: peak/Packages/PeakKit
        run: swift test

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          # Prefer a plain "iPhone NN" (no Pro/Plus/Air/e) on the newest runtime: its screen size is
          # known to the SDK, so the app isn't laid out in a compatibility mode.
          read -r UDID NAME <<<"$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted((k for k in devices if "iOS" in k), reverse=True):
              phones = [d for d in devices[runtime] if d["isAvailable"] and re.fullmatch(r"iPhone \d+", d["name"])]
              phones.sort(key=lambda d: int(d["name"].split()[1]), reverse=True)
              if phones:
                  print(phones[0]["udid"], phones[0]["name"]); break
          ')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using $NAME ($UDID)"

      - name: Build and test
        run: |
          set +e
          mkdir -p build
          xcodebuild test \
            -project Peak.xcodeproj \
            -scheme Peak \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          grep -E "error:|warning: .*/peak/|Test Case .*(passed|failed)|Test case .*(passed|failed)|✔|✘|\*\* (TEST|BUILD)" build.log | tail -400
          exit $status

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots || true
          fi
          ls -la build/screenshots | head -50

      - name: Name and shrink screenshots
        if: always()
        run: |
          mkdir -p build/named
          python3 - <<'PY'
          import json, os, shutil
          src = "build/screenshots"
          manifest = os.path.join(src, "manifest.json")
          entries = json.load(open(manifest)) if os.path.exists(manifest) else []
          for test in entries:
              for att in test.get("attachments", []):
                  exported = att.get("exportedFileName")
                  name = (att.get("suggestedHumanReadableName") or exported or "shot").split("_0_")[0]
                  if exported and exported.lower().endswith(".png"):
                      base = name if name.endswith(".png") else name + ".png"
                      shutil.copy(os.path.join(src, exported), os.path.join("build/named", base))
          print(sorted(os.listdir("build/named")))
          PY
          for f in build/named/*.png; do [ -e "$f" ] && sips -Z 1000 "$f" >/dev/null; done
          {
            xcodebuild -version
            echo "Simulator: ${{ steps.sim.outputs.name }}"
            echo
            grep -E "error:|Test case .*(passed|failed)|Test Case .*(passed|failed)|✘|\*\* (TEST|BUILD)" build.log | tail -200 || true
          } > build/named/summary.txt
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/Tests.xcresult > build/named/test-summary.json 2>&1 || true
          fi
          ls -la build/named

      # Artifacts live in blob storage; a plain git branch is easier to fetch for review.
      - name: Publish screenshots branch
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$(ls build/named 2>/dev/null)" ] || { echo "no screenshots"; exit 0; }
          BRANCH="ci-screenshots/${GITHUB_REF_NAME}"
          cd build/named
          git init -q -b main
          git config user.name "peak-ci"
          git config user.email "peak-ci@users.noreply.github.com"
          echo "Screenshots from ${GITHUB_SHA} (run ${GITHUB_RUN_ID})" > README.md
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          echo "Published to ${BRANCH}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peak-screenshots
          path: peak/build/named
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peak-build-log
          path: peak/build.log
          retention-days: 14

  # An unsigned iPhone build for sideloading with a free Apple ID (AltStore or Sideloadly re-sign it).
  # Unsigned means no entitlements: no push notifications and no widget data sharing, which free accounts
  # can't use anyway. Server address: peak/Config/sideload.env (empty = demo mode).
  ios-sideload:
    name: iPhone app file for AltStore / Sideloadly (.ipa)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: peak
    steps:
      - uses: actions/checkout@v4

      - name: Read server address
        id: config
        run: |
          url="$(sed -n 's/^PEAK_API_BASE_URL=//p' Config/sideload.env | tr -d '[:space:]')"
          case "$url" in
            "") echo "No server address set: building demo mode." ;;
            https://*) echo "Server: $url" ;;
            *) echo "::error::PEAK_API_BASE_URL in Config/sideload.env must start with https://"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iPhone (unsigned)
        env:
          API_BASE_URL: ${{ steps.config.outputs.url }}
        run: |
          set +e
          xcodebuild build \
            -project Peak.xcodeproj \
            -scheme Peak \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PEAK_API_BASE_URL="$API_BASE_URL" > build-device.log 2>&1
          status=$?
          grep -E "error:|\*\* BUILD" build-device.log | tail -100
          exit $status

      - name: Package .ipa
        env:
          API_BASE_URL: ${{ steps.config.outputs.url }}
        run: |
          app=build/dd/Build/Products/Release-iphoneos/Peak.app
          test -d "$app"
          ls "$app/PlugIns"
          baked="$(/usr/libexec/PlistBuddy -c 'Print :PeakAPIBaseURL' "$app/Info.plist")"
          echo "Baked server address: '${baked}'"
          [ "$baked" = "$API_BASE_URL" ] || { echo "::error::server address wasn't baked into Info.plist"; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Peak.ipa Payload)
          ls -la build/Peak.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Peak-ipa
          path: peak/build/Peak.ipa
          retention-days: 30
