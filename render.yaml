# Render Blueprint for Peak's staging server (peak/Server). Render → New → Blueprint → pick this repo.
# Free setup: Render's free plan runs the server; the database is a free Neon Postgres you create and paste in
# (Render's free database is deleted after 30 days). Secrets are entered in Render's dashboard, never here.
# Walkthrough: peak/Server/README.md → "Staging on Render (free)".
services:
  - type: web
    name: peak-staging
    runtime: docker
    # Free: sleeps after 15 minutes without requests and wakes (about a minute) when the app opens. While it
    # sleeps, stats aren't collected and alerts/briefings don't run. "starter" (paid) stays on.
    plan: free
    dockerfilePath: ./peak/Server/Dockerfile
    dockerContext: ./peak
    healthCheckPath: /health
    buildFilter:
      paths:
        - peak/Server/**
        - peak/Packages/PeakKit/**
    envVars:
      # From neon.tech → your project → Connect (the URL ends in sslmode=require).
      - key: DATABASE_URL
        sync: false
      # 32 random bytes, base64: exactly what the server needs to encrypt Roblox tokens.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # From your Roblox OAuth app (Creator Dashboard → OAuth 2.0 apps).
      - key: ROBLOX_CLIENT_ID
        sync: false
      - key: ROBLOX_CLIENT_SECRET
        sync: false
      # https://<this service's onrender.com address>/oauth/roblox/callback
      - key: ROBLOX_REDIRECT_URI
        sync: false
      # Optional AI wording: set ONE key (or neither to keep AI off). DeepSeek is the cheapest.
      #   DeepSeek: platform.deepseek.com    Claude: platform.claude.com (also set PEAK_AI_MODEL=claude-haiku-4-5 to keep it cheap)
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Limits for testing; raise them later.
      - key: PEAK_AI_MONTHLY_BUDGET_USD
        value: "5"
      - key: PEAK_AI_DAILY_ASKS
        value: "20"

