# XcodeGen spec — run `xcodegen generate` to produce RBXPulse.xcodeproj (not committed).
name: RBXPulse
options:
  bundleIdPrefix: com.rbxpulse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"

packages:
  RBXPulseKit:
    path: Packages/RBXPulseKit

targets:
  RBXPulse:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: SharedUI
    dependencies:
      - package: RBXPulseKit
      - target: RBXPulseWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RBX Pulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.rbxpulse.app
            CFBundleURLSchemes: [rbxpulse]
        # Empty = demo mode with sample data. Set per configuration once the backend exists.
        RBXPulseAPIBaseURL: $(RBXPULSE_API_BASE_URL)
    entitlements:
      path: App/RBXPulse.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rbxpulse.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rbxpulse.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        RBXPULSE_API_BASE_URL: ""

  RBXPulseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: SharedUI
    dependencies:
      - package: RBXPulseKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: RBX Pulse Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/RBXPulseWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rbxpulse.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rbxpulse.app.widgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  RBXPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: RBXPulse
      - package: RBXPulseKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rbxpulse.app.tests

  RBXPulseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: RBXPulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rbxpulse.app.uitests
        TEST_TARGET_NAME: RBXPulse

schemes:
  RBXPulse:
    build:
      targets:
        RBXPulse: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RBXPulseTests
        - RBXPulseUITests
