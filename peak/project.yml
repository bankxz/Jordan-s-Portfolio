# XcodeGen spec — run `xcodegen generate` to produce Peak.xcodeproj (not committed).
name: Peak
options:
  bundleIdPrefix: com.peakstats
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"

packages:
  PeakKit:
    path: Packages/PeakKit

targets:
  Peak:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: SharedUI
    dependencies:
      - package: PeakKit
      - target: PeakWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Peak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.peakstats.app
            CFBundleURLSchemes: [peakstats]
        # Empty = demo mode with sample data. Set per configuration once the backend exists.
        PeakAPIBaseURL: $(PEAK_API_BASE_URL)
    entitlements:
      path: App/Peak.entitlements
      properties:
        com.apple.security.application-groups: [group.com.peakstats.shared]
        # Development APNs; Xcode switches to production when archiving for the App Store.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peakstats.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PEAK_API_BASE_URL: ""

  PeakWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: SharedUI
    dependencies:
      - package: PeakKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Peak Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/PeakWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.peakstats.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peakstats.app.widgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PeakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      # PeakKit comes through the host app; linking it here too would duplicate its types at runtime.
      - target: Peak
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.peakstats.app.tests

  PeakUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: Peak
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.peakstats.app.uitests
        TEST_TARGET_NAME: Peak

schemes:
  Peak:
    build:
      targets:
        Peak: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PeakTests
        - PeakUITests
